  #   environment:
  #     SPARK_MODE: master
  #     SPARK_RPC_AUTHENTICATION_ENABLED: no
  #     SPARK_RPC_ENCRYPTION_ENABLED: no
  #     SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: no
  #     SPARK_SSL_ENABLED: no
  #   networks:
  #     - db-stream-network
  #   volumes:
  #     - spark-data:/opt/bitnami/spark/data

  # Spark Worker (TEMPORARILY DISABLED)
  # spark-worker:
  #   image: bitnami/spark:3.4
  #   hostname: spark-worker
  #   container_name: db-stream-spark-worker
  #   depends_on:
  #     - spark-master
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     SPARK_MODE: worker
  #     SPARK_MASTER_URL: spark://spark-master:7077
  #     SPARK_WORKER_MEMORY: 1G
  #     SPARK_WORKER_CORES: 1
  #     SPARK_RPC_AUTHENTICATION_ENABLED: no
  #     SPARK_RPC_ENCRYPTION_ENABLED: no
  #     SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: no
  #     SPARK_SSL_ENABLED: no
  #   networks:
  #     - db-stream-network
  #   volumes:
  #     - spark-data:/opt/bitnami/spark/data

  # Kafka UI for monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: db-stream-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8091:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: db-stream-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - db-stream-network
    restart: unless-stopped

  # Grafana for monitoring
  grafana:
    image: grafana/grafana:10.0.0
    hostname: grafana
    container_name: db-stream-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - db-stream-network
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana:/etc/grafana/provisioning

networks:
  db-stream-network:
    driver: bridge

volumes:
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  kafka-data:
    driver: local
  clickhouse-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  # spark-data:
  #   driver: local
  grafana-data:
    driver: local